<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라벨 OCR → 엑셀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; padding: 1rem; }
.container { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); height: fit-content; margin: auto; }
h2 { font-size: 18px; font-weight: 600; color: #111; margin-bottom: 4px; }
.sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #e6f9f1; color: #1a8a5e; margin-left: 6px; vertical-align: 2px; }

.lang-toggle { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.lang-btn { font-size: 12px; padding: 5px 12px; border-radius: 99px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; transition: all 0.15s; }
.lang-btn.active { background: #111; color: #fff; border-color: #111; }

.upload-zone { border: 2px dashed #ddd; border-radius: 12px; padding: 2rem 1rem; text-align: center; cursor: pointer; background: #fafafa; transition: border-color 0.2s; margin-bottom: 1rem; }
.upload-zone:hover { border-color: #aaa; }
.upload-zone i { font-size: 36px; color: #bbb; display: block; margin-bottom: 8px; }
.upload-zone p { font-size: 14px; color: #777; }
.upload-zone .hint { font-size: 12px; color: #bbb; margin-top: 4px; }
#fileInput { display: none; }

.preview-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; border: 1px solid #eee; margin-bottom: 1rem; background: #f9f9f9; display: none; }

.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; font-size: 14px; font-weight: 500; border-radius: 10px; border: 1px solid #ddd; background: #fff; color: #111; cursor: pointer; margin-bottom: 8px; transition: background 0.15s; }
.btn:hover { background: #f5f5f5; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: #111; color: #fff; border-color: #111; }
.btn-primary:hover { background: #333; }
.btn-green { background: #1D9E75; color: #fff; border-color: #1D9E75; }
.btn-green:hover { background: #18896a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.status { font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 1rem; display: none; }
.status.loading { background: #f5f5f5; color: #555; display: block; }
.status.success { background: #e6f9f1; color: #1a8a5e; display: block; }
.status.error { background: #fff0f0; color: #c0392b; display: block; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

.progress-wrap { height: 4px; background: #eee; border-radius: 2px; margin-bottom: 1rem; display: none; overflow: hidden; }
.progress-bar { height: 100%; background: #1D9E75; width: 0%; transition: width 0.3s; border-radius: 2px; }

.section-label { font-size: 12px; color: #999; margin-bottom: 6px; font-weight: 500; }
.raw-box { background: #f8f8f8; border: 1px solid #eee; border-radius: 8px; padding: 10px; font-size: 12px; font-family: monospace; color: #666; white-space: pre-wrap; word-break: break-all; max-height: 100px; overflow-y: auto; margin-bottom: 1rem; }

.result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 1rem; table-layout: fixed; }
.result-table th { background: #f8f8f8; color: #666; font-weight: 500; text-align: left; padding: 8px 10px; border: 1px solid #eee; width: 38%; font-size: 12px; }
.result-table td { padding: 6px 10px; border: 1px solid #eee; }
.result-table input { width: 100%; background: transparent; border: none; outline: none; font-size: 13px; color: #111; font-family: inherit; }
.result-table input:focus { background: #f8f8f8; border-radius: 4px; padding: 2px 4px; }

.divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.25rem 0; }

.history-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 6px; font-size: 13px; background: #fff; }
.history-item .name { font-weight: 500; color: #111; }
.history-item .meta { font-size: 12px; color: #aaa; }
.history-item .del-btn { background: none; border: none; cursor: pointer; color: #ccc; padding: 2px 6px; font-size: 16px; line-height: 1; }
.history-item .del-btn:hover { color: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <h2><i class="ti ti-scan"></i> 라벨 OCR <span class="badge">무료</span></h2>
  <p class="sub">사진 찍으면 텍스트 인식 → 엑셀 저장</p>

  <p class="section-label">인식 언어</p>
  <div class="lang-toggle">
    <button class="lang-btn active" data-lang="eng">영어/숫자</button>
    <button class="lang-btn" data-lang="kor">한국어</button>
    <button class="lang-btn" data-lang="kor+eng">한국어+영어</button>
  </div>

  <div class="upload-zone" id="uploadZone">
    <i class="ti ti-camera"></i>
    <p>탭해서 사진 찍기 또는 파일 선택</p>
    <p class="hint">JPG, PNG 지원</p>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>

  <img id="previewImg" class="preview-img" alt="미리보기">
  <div id="status" class="status"></div>
  <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>

  <button class="btn btn-primary" id="analyzeBtn" disabled>
    <i class="ti ti-wand"></i> OCR 분석 시작
  </button>

  <div id="resultSection" style="display:none;">
    <hr class="divider">
    <p class="section-label">원본 인식 텍스트</p>
    <div class="raw-box" id="rawBox"></div>
    <p class="section-label">정리된 필드 (수정 가능)</p>
    <table class="result-table"><tbody id="resultBody"></tbody></table>
    <button class="btn" id="addRowBtn"><i class="ti ti-plus"></i> 행 추가</button>
    <button class="btn btn-green" id="saveBtn"><i class="ti ti-device-floppy"></i> 목록에 추가</button>
  </div>

  <div id="historySection" style="display:none;">
    <hr class="divider">
    <p class="section-label">저장된 항목 (<span id="countBadge">0</span>개)</p>
    <div id="historyList"></div>
    <button class="btn btn-green" id="excelBtn"><i class="ti ti-file-spreadsheet"></i> 엑셀 다운로드</button>
    <button class="btn" id="clearBtn" style="margin-top:4px;color:#e74c3c;border-color:#f5c6c6;"><i class="ti ti-trash"></i> 목록 초기화</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let currentFile = null, savedItems = [], selectedLang = 'eng';

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedLang = btn.dataset.lang;
  });
});

$('uploadZone').addEventListener('click', () => $('fileInput').click());
$('uploadZone').addEventListener('dragover', e => e.preventDefault());
$('uploadZone').addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
$('fileInput').addEventListener('change', () => handleFile($('fileInput').files[0]));

function handleFile(file) {
  if (!file) return;
  currentFile = file;
  const url = URL.createObjectURL(file);
  $('previewImg').src = url;
  $('previewImg').style.display = 'block';
  $('analyzeBtn').disabled = false;
  $('resultSection').style.display = 'none';
  setStatus('', '');
}

function setStatus(type, msg) {
  const el = $('status');
  el.className = 'status ' + type;
  el.innerHTML = msg;
  el.style.display = type ? 'block' : 'none';
}

$('analyzeBtn').addEventListener('click', async () => {
  if (!currentFile) return;
  $('analyzeBtn').disabled = true;
  $('resultSection').style.display = 'none';
  setStatus('loading', '<span class="spinner"></span> OCR 처리 중... 첫 실행 시 30초 정도 걸릴 수 있어요');
  $('progressWrap').style.display = 'block';
  $('progressBar').style.width = '0%';

  try {
    const result = await Tesseract.recognize(currentFile, selectedLang, {
      logger: m => {
        if (m.status === 'recognizing text') {
          $('progressBar').style.width = Math.round(m.progress * 100) + '%';
        }
      }
    });
    $('progressBar').style.width = '100%';
    setTimeout(() => { $('progressWrap').style.display = 'none'; }, 500);

    const text = result.data.text.trim();
    $('rawBox').textContent = text || '(인식 결과 없음)';
    renderTable(parseFields(text));
    $('resultSection').style.display = 'block';
    setStatus('success', '✓ 인식 완료! 수정 후 저장하세요.');
  } catch(e) {
    $('progressWrap').style.display = 'none';
    setStatus('error', '오류: ' + e.message);
  } finally {
    $('analyzeBtn').disabled = false;
  }
});

function parseFields(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
  const fields = [], seen = new Set();
  lines.forEach(line => {
    if (seen.has(line)) return;
    seen.add(line);
    const col = line.match(/^(.+?)[:：|]\s*(.+)$/);
    if (col) { fields.push({ key: col[1].trim(), value: col[2].trim() }); return; }
    if (line.match(/^[A-Z][A-Z0-9]{2,}-[A-Z0-9\-]+$/)) { fields.push({ key: '모델번호', value: line }); return; }
    const sn = line.match(/(?:SN|S\/N|Serial)\s*[:\-]?\s*([A-Z0-9]+)/i);
    if (sn) { fields.push({ key: '시리얼번호', value: sn[1] }); return; }
    const wt = line.match(/(\d+\.?\d*)\s*kg/i);
    if (wt) { fields.push({ key: '무게', value: wt[1] + ' kg' }); return; }
    if (line.length > 2 && line.length < 60) fields.push({ key: '항목' + (fields.length + 1), value: line });
  });
  return fields.length ? fields : [{ key: '원본', value: text.replace(/\n/g, ' ') }];
}

function renderTable(fields) {
  $('resultBody').innerHTML = '';
  fields.forEach(f => addRow(f.key, f.value));
}

function addRow(key = '', value = '') {
  const tr = document.createElement('tr');
  tr.innerHTML = `<th><input value="${esc(key)}" placeholder="항목명"></th><td><input value="${esc(value)}" placeholder="값"></td>`;
  $('resultBody').appendChild(tr);
}

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

$('addRowBtn').addEventListener('click', () => addRow());

$('saveBtn').addEventListener('click', () => {
  const rows = $('resultBody').querySelectorAll('tr');
  const item = { timestamp: new Date().toLocaleString('ko-KR'), fields: [] };
  rows.forEach(tr => {
    const ins = tr.querySelectorAll('input');
    const k = ins[0].value.trim(), v = ins[1].value.trim();
    if (k) item.fields.push({ key: k, value: v });
  });
  if (!item.fields.length) return;
  savedItems.push(item);
  renderHistory();
  setStatus('success', '✓ 저장됐어요! (' + savedItems.length + '개 누적)');
});

function renderHistory() {
  $('historyList').innerHTML = '';
  $('countBadge').textContent = savedItems.length;
  savedItems.forEach((item, idx) => {
    const main = item.fields.find(f => f.key.includes('모델') || f.value.match(/^[A-Z0-9\-]{6,}$/));
    const label = main ? main.value : item.fields[0]?.value || '항목 ' + (idx+1);
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `<div><div class="name">${esc(label)}</div><div class="meta">${item.timestamp} · ${item.fields.length}개 필드</div></div><button class="del-btn" onclick="removeItem(${idx})">×</button>`;
    $('historyList').appendChild(div);
  });
  $('historySection').style.display = savedItems.length ? 'block' : 'none';
}

window.removeItem = idx => { savedItems.splice(idx, 1); renderHistory(); };

$('clearBtn').addEventListener('click', () => {
  if (confirm('전체 삭제할까요?')) { savedItems = []; renderHistory(); }
});

$('excelBtn').addEventListener('click', () => {
  if (!savedItems.length) return;
  const allKeys = [...new Set(savedItems.flatMap(i => i.fields.map(f => f.key)))];
  const headers = ['촬영시각', ...allKeys];
  const rows = savedItems.map(item => {
    const row = [item.timestamp];
    allKeys.forEach(k => { const f = item.fields.find(f => f.key === k); row.push(f ? f.value : ''); });
    return row;
  });
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map(() => ({ wch: 20 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '라벨 데이터');
  const now = new Date();
  XLSX.writeFile(wb, `라벨_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`);
});
</script>
</body>
</html>
